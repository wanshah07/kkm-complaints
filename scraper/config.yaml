# KKM Cosmetic Complaint System — scraper targets.
# Add a brand or a platform by adding an entry; nothing else changes.
# Handles are the public profile slugs. Facebook accepts a page slug or a numeric page ID.

run:
  max_posts_per_profile: 6        # newest posts examined per brand × platform
  lookback_days: 0                # 0 = off; otherwise skip posts older than N days when a date is known
  min_post_date: "2025-09-01"     # review only posts published on/after this date (YYYY-MM-DD); "" = off
  push_risky: true                # also push "Risky" verdicts (status New, type prefixed "Risky:")
  min_confidence: 0.6             # drop Unacceptable verdicts below this reviewer confidence
  usd_to_myr: 0                   # set to your card's rate (e.g. 4.7) to also show RM in the run summary; 0 = USD only
  screenshot_max_width: 1200      # px, before JPEG compression
  screenshot_jpeg_quality: 80
  headless: true
  locale: en-MY
  timezone: Asia/Kuala_Lumpur
  # Pacing. Opening a dozen profiles and dozens of posts back to back reads as a bot and is
  # what gets an account restricted. Each wait is randomised between its min and max so the
  # rhythm is not machine-regular. Set any pair to 0 to disable that wait.
  # Defaults turn a ~2 minute run into ~15, which is irrelevant for a weekly overnight job.
  pause_between_posts: [8, 25]        # seconds, before each post page
  pause_between_profiles: [45, 120]   # seconds, before each new brand/platform profile
  pause_after_scroll: [1.5, 3.5]      # seconds, between scrolls on a profile grid

  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

platforms:
  Instagram:
    profile_url: "https://www.instagram.com/{handle}/"
    post_link_patterns: ["/p/", "/reel/"]
  Facebook:
    profile_url: "https://www.facebook.com/{handle}"
    # www renders its feed with JavaScript and often yields no anchors to a logged-out or
    # datacenter visitor. mbasic serves plain HTML with ordinary links, so it is tried when
    # the main URL finds nothing. Each fallback is attempted in order.
    profile_url_fallbacks:
      - "https://mbasic.facebook.com/{handle}"
      - "https://m.facebook.com/{handle}"
    post_link_patterns: ["/posts/", "/photos/", "/videos/", "/reel/", "story_fbid=", "/permalink/", "/story.php"]
  Threads:
    profile_url: "https://www.threads.net/@{handle}"
    post_link_patterns: ["/post/"]

brands:
  - name: "La Roche-Posay"
    handles:
      Instagram: larocheposaymy
      Facebook: LaRochePosayMalaysia
      Threads: larocheposaymy
    product_hints: ["Effaclar", "Cicaplast", "Anthelios", "Toleriane", "Lipikar", "Mela B3", "Hyalu B5"]
  - name: "Eucerin"
    handles:
      Instagram: eucerin_malaysia
      Facebook: EucerinMalaysia
      Threads: eucerin_malaysia
    product_hints: ["Spotless Brightening", "Ultrasensitive", "Atopicontrol", "Sun Gel-Creme", "Dermopurifyer", "Urea Repair", "Hyaluron-Filler"]
  - name: "QV"
    handles:
      Instagram: qvskincaremy
      Facebook: QVSkincareMalaysia
      Threads: qvskincaremy
    product_hints: ["QV Gentle Wash", "QV Cream", "QV Face", "QV Baby", "QV Intensive"]
  - name: "The Raw"
    handles:
      Instagram: therawmy
      Facebook: therawmy
      Threads: therawmy
    product_hints: []
