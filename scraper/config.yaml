# KKM Cosmetic Complaint System — scraper targets.
# Add a brand or a platform by adding an entry; nothing else changes.
# Handles are the public profile slugs. Facebook accepts a page slug or a numeric page ID.

run:
  max_posts_per_profile: 60       # newest posts examined per brand × platform (posts already in the sheet are not opened)
  lookback_days: 0                # 0 = off; otherwise skip posts older than N days when a date is known
  min_post_date: "2024-06-01"     # review only posts published on/after this date (YYYY-MM-DD); "" = off
  push_risky: true                # also push "Risky" verdicts (status New, type prefixed "Risky:")
  min_confidence: 0.6             # drop Unacceptable verdicts below this reviewer confidence
  usd_to_myr: 0                   # set to your card's rate (e.g. 4.7) to also show RM in the run summary; 0 = USD only
  # Stop starting new targets once the run has been going this long, and finish cleanly. The
  # GitHub job is killed at timeout-minutes: 180 (see .github/workflows/scraper.yml) and that
  # kill lands mid-post: no summary, no report, and the target in flight is wasted. Stopping
  # ourselves a little earlier means the run ends on its own terms and says what it did not
  # reach. Raise it only alongside the workflow's timeout-minutes.
  # 145, not 160 (6 Oct 2026): run 107 started its last target 8 minutes inside the old budget, the
  # reviewer gateway was slow that day (one target's review took 24 minutes), and the 180-minute kill
  # landed mid-review. The budget only gates the START of a target, so it needs room for the longest tail.
  # 110, not 145 (7 Oct 2026): run 111 (60 posts per profile) was cancelled at 180 minutes. Its last
  # target, nazirinskinclinic, started 124 minutes in, scraped 20 posts, and the reviewer gateway then
  # slowed to 2-5 minutes a call with 502s, so those 20 could not be reviewed before the kill. A tail of
  # 70 minutes covers a healthy 40 and a slow gateway; 130 would still have let that target start.
  # 95, not 110 (7 Oct 2026): run 114 ended at 2h48m, 12 minutes inside the kill. Its last target, drangelinetay
  # Instagram, started 91 minutes in and took 78 minutes (10 to scrape, 68 to review on a slow gateway), so a
  # target started at 109 minutes could have run to 189. The tail has to cover that: 180 - 95 = 85 minutes.
  # 80, not 95 (8 Oct 2026): run 119 was cancelled at 180 minutes with the 95-minute budget. klinikdrbazilah
  # Instagram started 51 minutes in, and the reviewer gateway needed 3-5 minutes a call (502 after 300 s), so 13
  # of its 60 posts were judged in 2 hours. The budget cannot fix a gateway that slow; it only shortens the
  # time before a new pair may start. See flush_every_reviews below for what keeps the judged posts.
  max_run_minutes: 80
  # File and ledger a pair's judged posts every N reviews instead of only when the whole pair is done, so a
  # run killed mid-pair keeps what it paid for (8 Oct 2026). 0 turns it off.
  flush_every_reviews: 10
  screenshot_max_width: 1200      # px, before JPEG compression
  screenshot_jpeg_quality: 80
  headless: true
  locale: en-MY
  timezone: Asia/Kuala_Lumpur
  # Pacing. Opening a dozen profiles and dozens of posts back to back reads as a bot and is
  # what gets an account restricted. Each wait is randomised between its min and max so the
  # rhythm is not machine-regular. Set any pair to 0 to disable that wait.
  # Defaults turn a ~2 minute run into ~15, which is irrelevant for a weekly overnight job.
  pause_between_posts: [8, 25]        # seconds, before each post page
  pause_between_profiles: [45, 120]   # seconds, before each new brand/platform profile
  pause_after_scroll: [1.5, 3.5]      # seconds, between scrolls on a profile grid

  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

platforms:
  Instagram:
    profile_url: "https://www.instagram.com/{handle}/"
    post_link_patterns: ["/p/", "/reel/"]
  Facebook:
    profile_url: "https://www.facebook.com/{handle}"
    # www renders its feed with JavaScript and often yields no anchors to a logged-out or
    # datacenter visitor. mbasic serves plain HTML with ordinary links, so it is tried when
    # the main URL finds nothing. Each fallback is attempted in order.
    profile_url_fallbacks:
      - "https://mbasic.facebook.com/{handle}"
      - "https://m.facebook.com/{handle}"
    post_link_patterns: ["/posts/", "/photos/", "/videos/", "/reel/", "story_fbid=", "/permalink/", "/story.php"]
  Threads:
    profile_url: "https://www.threads.net/@{handle}"
    post_link_patterns: ["/post/"]

brands:
  - name: "La Roche-Posay"
    handles:
      Instagram: larocheposaymy
      Facebook: LaRochePosayMalaysia
      Threads: larocheposaymy
    product_hints: ["Effaclar", "Cicaplast", "Anthelios", "Toleriane", "Lipikar", "Mela B3", "Hyalu B5"]
  - name: "Eucerin"
    handles:
      Instagram: eucerin_malaysia
      Facebook: EucerinMalaysia
      Threads: eucerin_malaysia
    product_hints: ["Spotless Brightening", "Ultrasensitive", "Atopicontrol", "Sun Gel-Creme", "Dermopurifyer", "Urea Repair", "Hyaluron-Filler"]
  - name: "QV"
    handles:
      Instagram: qvskincaremy
      Facebook: QVSkincareMalaysia
      Threads: qvskincaremy
    product_hints: ["QV Gentle Wash", "QV Cream", "QV Face", "QV Baby", "QV Intensive"]
  - name: "The Raw"
    handles:
      Instagram: therawmy
      Facebook: therawmy
      Threads: therawmy
    product_hints: []
