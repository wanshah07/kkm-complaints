# KKM Cosmetic Complaint System — weekly scrape + NPRA review + push to Google Sheets.
#
# There is no cron here on purpose (Wan, 19 Sep 2026). The weekly sweep is driven by the
# "KKM weekly cosmetic ads sweep" routine, which fires Friday 23:30 MYT and dispatches this
# workflow in batches — only_type=brand first, then only_type=person until nothing is
# unreached — reporting each batch as it lands. A cron here would be a second, unbatched
# sweep competing for the same concurrency slot: run 35381137970 did exactly that, held the
# runner for 2h42m, re-walked 51 already-judged targets and filed nothing, while the batch
# that had work to do sat queued behind it. Trigger a one-off from Run workflow below.
#
# Required repository secrets
#   APPS_SCRIPT_WEBHOOK_URL   the Apps Script /exec URL
#   APPS_SCRIPT_API_TOKEN     API_TOKEN from the sheet's Script Properties
#   ANTHROPIC_API_KEY         (or OPENAI_API_KEY with LLM_PROVIDER=openai)
# Optional
#   PW_STORAGE_STATE_B64      base64 storage_state.json of a logged-in throwaway account
#   GDRIVE_SA_JSON            service-account JSON when SCREENSHOT_MODE=drive_api
#   GDRIVE_FOLDER_ID          Drive folder shared with that service account

name: KKM complaint scraper

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and review, but do not push to the sheet'
        type: boolean
        default: false
      brand:
        description: 'Only this brand (exact name from config.yaml)'
        type: string
        default: ''
      platform:
        description: 'Only this platform (Instagram | Facebook | Threads)'
        type: string
        default: ''
      only_type:
        description: 'Sweep one kind of target only, so a long watchlist fits inside one run'
        type: choice
        options: ['', 'brand', 'person']
        default: ''
      offset:
        description: 'Rotate the already-judged targets by N. The watchlist is longer than one run, and without this every run re-walks it from the top and the tail is never reached. Increase by one each run.'
        type: string
        default: '0'
      skip_unjudged:
        description: 'Skip targets we have never judged a post from. They are walked first on every run and are mostly rows that cannot produce one (private, wrong handle, nothing in the date window) - two thirds of run 6 went on them. Do NOT tick this on the first run after adding handles: a new handle is unjudged too.'
        type: boolean
        default: false
      compare:
        description: 'Review every post with BOTH reviewers and print where they disagree (never pushes)'
        type: boolean
        default: false
      selftest:
        description: 'Check the deployed Apps Script instead of scraping: payload size, truncation, search. Read-only, finishes in seconds. Put a word here to search for, or "1" to pick one.'
        type: string
        default: ''

concurrency:
  group: kkm-complaint-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # paced runs are deliberately slow; ~3 min per target, see run.pause_* in config.yaml
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      LLM_USE_SCREENSHOT: ${{ vars.LLM_USE_SCREENSHOT || '1' }}
      SCREENSHOT_MODE: ${{ vars.SCREENSHOT_MODE || 'apps_script' }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.brand }}" ]; then ARGS="$ARGS --brand \"${{ github.event.inputs.brand }}\""; fi
          if [ -n "${{ github.event.inputs.platform }}" ]; then ARGS="$ARGS --platform ${{ github.event.inputs.platform }}"; fi
          if [ -n "${{ github.event.inputs.only_type }}" ]; then ARGS="$ARGS --only-type ${{ github.event.inputs.only_type }}"; fi
          if [ -n "${{ github.event.inputs.offset }}" ] && [ "${{ github.event.inputs.offset }}" != "0" ]; then ARGS="$ARGS --offset ${{ github.event.inputs.offset }}"; fi
          if [ "${{ github.event.inputs.skip_unjudged }}" = "true" ]; then ARGS="$ARGS --skip-unjudged"; fi
          if [ "${{ github.event.inputs.compare }}" = "true" ]; then ARGS="$ARGS --compare"; fi
          # A selftest replaces the run rather than adding to it: no browser, no scrape, no writes.
          if [ -n "${{ github.event.inputs.selftest }}" ]; then
            if [ "${{ github.event.inputs.selftest }}" = "1" ]; then ARGS="--selftest"
            else ARGS="--selftest \"${{ github.event.inputs.selftest }}\""; fi
          fi
          eval python main.py $ARGS

      - name: Upload run artefacts (report + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkm-run-${{ github.run_id }}
          path: scraper/out/
          retention-days: 30
          if-no-files-found: ignore
