# KKM Cosmetic Complaint System — weekly scrape + NPRA review + push to Google Sheets.
#
# Runs by itself on two schedules (GitHub reads cron as UTC only):
#   - DAILY BRAND SWEEP, 04:07 MYT on Sun, Mon, Tue, Wed, Thu and Fri mornings (cron '7 20 * * 0-4,6' = 20:07
#     UTC the evening before; Saturday morning is skipped because Friday 23:30 MYT has the weekly run). Wan, 17 Nov 2026: "set up the daily sweep schedule ... leave them daily run" (the accounts
#     that hit the per-visit cap are left to this run). Brand accounts only, oldest-swept first, at most
#     15 new posts per account per visit: each run carries on where the last one stopped, so the whole
#     brand list comes round about every 4 to 7 days and a capped account is simply visited again. The person
#     sweep is NOT part of it (it needs Wan's go-ahead). It ends well before the morning (100 min budget).
#   - WEEKLY FULL RUN, every Friday 23:30 MYT (cron '30 15 * * 5' = 15:30 UTC). Wan, 6 Nov 2026: "kkm
#     complaints make it auto run". Every target type, as before.
# Run workflow below still works for a one-off, batched (only_type / offset) or dry run.
#
# A scheduled run has NO inputs, so every input below falls back to its dispatch default, except that the
# daily run's own defaults are set in the env block of the Run scraper step (keyed on github.event.schedule,
# so the string there must match the cron line below exactly). The Friday run is still the same as pressing
# Run workflow and changing nothing: a live run (not dry), every target type, offset 0, unjudged targets
# included, LLM reviewer on. Either stops starting new targets at run.max_run_minutes (config.yaml) and lists
# what it did not reach.
#
# History: from 19 Sep to 6 Nov 2026 there was no cron here, because a Claude routine dispatched this
# workflow in batches and a cron competed with it for the runner (run 35381137970 held it 2h42m and
# filed nothing). That chain finished its first full pass of the brand list on 17 Nov 2026 (runs 15 to 23) and
# is stopped, so the schedules below are the only driver. If a Claude routine is ever made to dispatch sweeps
# again, take the daily schedule out first: one cron per job, never two drivers of the same sweep.
#
# The concurrency group below means a scheduled run and a manual run never overlap, so the sheet is
# never written by two runs at once. A run that arrives while one is going waits for it.
#
# Required repository secrets
#   APPS_SCRIPT_WEBHOOK_URL   the Apps Script /exec URL
#   APPS_SCRIPT_API_TOKEN     API_TOKEN from the sheet's Script Properties
#   ANTHROPIC_API_KEY         (or OPENAI_API_KEY with LLM_PROVIDER=openai)
# Optional
#   PW_STORAGE_STATE_B64      base64 storage_state.json of a logged-in throwaway account
#   GDRIVE_SA_JSON            service-account JSON when SCREENSHOT_MODE=drive_api
#   GDRIVE_FOLDER_ID          Drive folder shared with that service account

name: KKM complaint scraper

on:
  schedule:
    - cron: '30 15 * * 5'       # Friday 15:30 UTC = Friday 23:30 MYT: the weekly full run
    - cron: '7 20 * * 0-4,6'    # 20:07 UTC = 04:07 MYT next day, Sun-Thu + Sat UTC: the daily brand sweep
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and review, but do not push to the sheet'
        type: boolean
        default: false
      brand:
        description: 'Only this brand (exact name from config.yaml)'
        type: string
        default: ''
      platform:
        description: 'Only this platform (Instagram | Facebook | Threads)'
        type: string
        default: ''
      only_type:
        description: 'Sweep one kind of target only, so a long watchlist fits inside one run (web = the pharmacy / retailer / brand website rows)'
        type: choice
        options: ['', 'brand', 'person', 'web']
        default: ''
      offset:
        description: 'Rotate the already-judged targets by N. The watchlist is longer than one run, and without this every run re-walks it from the top and the tail is never reached. Increase by one each run.'
        type: string
        default: '0'
      order:
        description: 'oldest = accounts never swept first, then the ones swept longest ago (no offset needed, and editing the Targets tab cannot shift it). Blank = the old order, rotated by offset.'
        type: choice
        options: ['', 'oldest']
        default: ''
      max_open:
        description: 'Judge at most this many unjudged posts per account in this run, newest first (blank = no cap). The rest wait for that account''s next visit.'
        type: string
        default: ''
      skip_unjudged:
        description: 'Skip targets we have never judged a post from. They are walked first on every run and are mostly rows that cannot produce one (private, wrong handle, nothing in the date window) - two thirds of run 6 went on them. Do NOT tick this on the first run after adding handles: a new handle is unjudged too.'
        type: boolean
        default: false
      since:
        description: 'Only review posts published on/after this date, YYYY-MM-DD, for this run only (blank = the config.yaml floor, 2024-06-01). Skintific this year: 2026-01-01.'
        type: string
        default: ''
      hashtag:
        description: 'Instead of walking Targets rows: review the posts Instagram lists under these hashtags, space separated, no # (e.g. skintificmy skintificmalaysia). Use with since, focus and exclude_owner; max_open caps the posts opened per tag (default 40).'
        type: string
        default: ''
      exclude_owner:
        description: 'With hashtag: skip posts whose account handle contains this word (the official accounts, e.g. skintific)'
        type: string
        default: ''
      focus:
        description: 'Only review NEW posts whose text contains this word (e.g. skintific: matches @skintific.my, #skintific, the plain word). Known/ledgered posts are skipped as always; non-matching new posts are not reviewed and not ledgered.'
        type: string
        default: ''
      compare:
        description: 'Review every post with BOTH reviewers and print where they disagree (never pushes)'
        type: boolean
        default: false
      selftest:
        description: 'Check the deployed Apps Script instead of scraping: payload size, truncation, search. Read-only, finishes in seconds. Put a word here to search for, or "1" to pick one.'
        type: string
        default: ''

# One run at a time, scheduled or manual, so two runs can never write the Google Sheet together.
# Never cancel a run in progress: it files each target as it finishes. (GitHub keeps one waiting
# run per group; a newer one waiting replaces an older one waiting, never the one running.)
concurrency:
  group: kkm-complaint-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # paced runs are deliberately slow; ~3 min per target, see run.pause_* in config.yaml
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      # Website feed URLs come from the Apps Script (Code.gs 4 Oct 2026, once deployed). TARGETS_SHEET_ID is only a
      # fallback that reads the Targets tab as CSV, which needs link sharing on the sheet: leave the secret unset and
      # keep the sheet Restricted. This repo is PUBLIC, so the id must never be written in this file.
      TARGETS_SHEET_ID: ${{ secrets.TARGETS_SHEET_ID }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      # Second gateway (KiosAPI, 23 Oct 2026): inert until OPENAI_ALT_API_KEY (secret) and OPENAI_ALT_BASE_URL are both set.
      OPENAI_ALT_BASE_URL: ${{ vars.OPENAI_ALT_BASE_URL }}
      OPENAI_ALT_API_KEY: ${{ secrets.OPENAI_ALT_API_KEY }}
      OPENAI_ALT_MODEL: ${{ vars.OPENAI_ALT_MODEL }}
      OPENAI_ALT_SHARE: ${{ vars.OPENAI_ALT_SHARE }}
      LLM_USE_SCREENSHOT: ${{ vars.LLM_USE_SCREENSHOT || '1' }}
      SCREENSHOT_MODE: ${{ vars.SCREENSHOT_MODE || 'apps_script' }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        # Inputs travel as env, not pasted into the script. On a scheduled run the inputs context is
        # empty, so each one falls back to the same default the dispatch form shows.
        env:
          IN_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          IN_BRAND: ${{ inputs.brand || '' }}
          IN_PLATFORM: ${{ inputs.platform || '' }}
          IN_ONLY_TYPE: ${{ inputs.only_type || (github.event.schedule == '7 20 * * 0-4,6' && 'brand') || '' }}
          IN_OFFSET: ${{ inputs.offset || '0' }}
          IN_ORDER: ${{ inputs.order || (github.event.schedule == '7 20 * * 0-4,6' && 'oldest') || '' }}
          IN_MAX_OPEN: ${{ inputs.max_open || (github.event.schedule == '7 20 * * 0-4,6' && '15') || '' }}
          IN_SKIP_UNJUDGED: ${{ inputs.skip_unjudged && 'true' || 'false' }}
          IN_COMPARE: ${{ inputs.compare && 'true' || 'false' }}
          IN_FOCUS: ${{ inputs.focus || '' }}
          IN_SINCE: ${{ inputs.since || '' }}
          IN_HASHTAG: ${{ inputs.hashtag || '' }}
          IN_EXCLUDE_OWNER: ${{ inputs.exclude_owner || '' }}
          IN_SELFTEST: ${{ inputs.selftest || '' }}
        run: |
          echo "trigger: ${{ github.event_name }}"
          ARGS=()
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_BRAND" ]; then ARGS+=(--brand "$IN_BRAND"); fi
          if [ -n "$IN_PLATFORM" ]; then read -ra P <<< "$IN_PLATFORM"; ARGS+=(--platform "${P[@]}"); fi
          if [ -n "$IN_ONLY_TYPE" ]; then ARGS+=(--only-type "$IN_ONLY_TYPE"); fi
          if [ -n "$IN_OFFSET" ] && [ "$IN_OFFSET" != "0" ]; then ARGS+=(--offset "$IN_OFFSET"); fi
          if [ "$IN_ORDER" = "oldest" ]; then ARGS+=(--order oldest); fi
          if [[ "$IN_MAX_OPEN" =~ ^[0-9]+$ ]]; then ARGS+=(--max-open "$IN_MAX_OPEN"); fi
          if [ "$IN_SKIP_UNJUDGED" = "true" ]; then ARGS+=(--skip-unjudged); fi
          if [ "$IN_COMPARE" = "true" ]; then ARGS+=(--compare); fi
          if [ -n "$IN_FOCUS" ]; then ARGS+=(--focus "$IN_FOCUS"); fi
          if [ -n "$IN_SINCE" ]; then ARGS+=(--since "$IN_SINCE"); fi
          if [ -n "$IN_HASHTAG" ]; then read -ra H <<< "$IN_HASHTAG"; ARGS+=(--hashtag "${H[@]}"); fi
          if [ -n "$IN_EXCLUDE_OWNER" ]; then read -ra X <<< "$IN_EXCLUDE_OWNER"; ARGS+=(--exclude-owner "${X[@]}"); fi
          # A selftest replaces the run rather than adding to it: no browser, no scrape, no writes.
          if [ -n "$IN_SELFTEST" ]; then
            if [ "$IN_SELFTEST" = "1" ]; then ARGS=(--selftest)
            else ARGS=(--selftest "$IN_SELFTEST"); fi
          fi
          echo "python main.py ${ARGS[*]}"
          python main.py "${ARGS[@]}"

      - name: Upload run artefacts (report + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkm-run-${{ github.run_id }}
          path: scraper/out/
          retention-days: 30
          if-no-files-found: ignore
