# KKM Cosmetic Complaint System — weekly scrape + NPRA review + push to Google Sheets.
#
# Runs by itself every Friday 23:30 MYT (cron '30 15 * * 5', which is 15:30 UTC; GitHub reads cron as
# UTC only). Wan, 6 Nov 2026: "kkm complaints make it auto run". Run workflow below still works for a
# one-off, batched (only_type / offset) or dry run.
#
# A scheduled run has NO inputs, so every input below falls back to its dispatch default: a live run
# (not dry), every target type, offset 0, unjudged targets included, LLM reviewer on. It is the same
# run as pressing Run workflow and changing nothing. It stops starting new targets at
# run.max_run_minutes (config.yaml) and lists what it did not reach.
#
# History: from 19 Sep to 6 Nov 2026 there was no cron here, because a Claude routine dispatched this
# workflow in batches and a cron competed with it for the runner (run 35381137970 held it 2h42m and
# filed nothing). That chain is paused. If it is ever re-enabled, take the schedule below out first:
# one cron per job, never two drivers of the same sweep.
#
# The concurrency group below means a scheduled run and a manual run never overlap, so the sheet is
# never written by two runs at once. A run that arrives while one is going waits for it.
#
# Required repository secrets
#   APPS_SCRIPT_WEBHOOK_URL   the Apps Script /exec URL
#   APPS_SCRIPT_API_TOKEN     API_TOKEN from the sheet's Script Properties
#   ANTHROPIC_API_KEY         (or OPENAI_API_KEY with LLM_PROVIDER=openai)
# Optional
#   PW_STORAGE_STATE_B64      base64 storage_state.json of a logged-in throwaway account
#   GDRIVE_SA_JSON            service-account JSON when SCREENSHOT_MODE=drive_api
#   GDRIVE_FOLDER_ID          Drive folder shared with that service account

name: KKM complaint scraper

on:
  schedule:
    - cron: '30 15 * * 5'   # Friday 15:30 UTC = Friday 23:30 MYT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and review, but do not push to the sheet'
        type: boolean
        default: false
      brand:
        description: 'Only this brand (exact name from config.yaml)'
        type: string
        default: ''
      platform:
        description: 'Only this platform (Instagram | Facebook | Threads)'
        type: string
        default: ''
      only_type:
        description: 'Sweep one kind of target only, so a long watchlist fits inside one run (web = the pharmacy / retailer / brand website rows)'
        type: choice
        options: ['', 'brand', 'person', 'web']
        default: ''
      offset:
        description: 'Rotate the already-judged targets by N. The watchlist is longer than one run, and without this every run re-walks it from the top and the tail is never reached. Increase by one each run.'
        type: string
        default: '0'
      skip_unjudged:
        description: 'Skip targets we have never judged a post from. They are walked first on every run and are mostly rows that cannot produce one (private, wrong handle, nothing in the date window) - two thirds of run 6 went on them. Do NOT tick this on the first run after adding handles: a new handle is unjudged too.'
        type: boolean
        default: false
      compare:
        description: 'Review every post with BOTH reviewers and print where they disagree (never pushes)'
        type: boolean
        default: false
      selftest:
        description: 'Check the deployed Apps Script instead of scraping: payload size, truncation, search. Read-only, finishes in seconds. Put a word here to search for, or "1" to pick one.'
        type: string
        default: ''

# One run at a time, scheduled or manual, so two runs can never write the Google Sheet together.
# Never cancel a run in progress: it files each target as it finishes. (GitHub keeps one waiting
# run per group; a newer one waiting replaces an older one waiting, never the one running.)
concurrency:
  group: kkm-complaint-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # paced runs are deliberately slow; ~3 min per target, see run.pause_* in config.yaml
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      # Website feed URLs come from the Apps Script (Code.gs 4 Oct 2026, once deployed). TARGETS_SHEET_ID is only a
      # fallback that reads the Targets tab as CSV, which needs link sharing on the sheet: leave the secret unset and
      # keep the sheet Restricted. This repo is PUBLIC, so the id must never be written in this file.
      TARGETS_SHEET_ID: ${{ secrets.TARGETS_SHEET_ID }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      # Second gateway (KiosAPI, 23 Oct 2026): inert until OPENAI_ALT_API_KEY (secret) and OPENAI_ALT_BASE_URL are both set.
      OPENAI_ALT_BASE_URL: ${{ vars.OPENAI_ALT_BASE_URL }}
      OPENAI_ALT_API_KEY: ${{ secrets.OPENAI_ALT_API_KEY }}
      OPENAI_ALT_MODEL: ${{ vars.OPENAI_ALT_MODEL }}
      OPENAI_ALT_SHARE: ${{ vars.OPENAI_ALT_SHARE }}
      LLM_USE_SCREENSHOT: ${{ vars.LLM_USE_SCREENSHOT || '1' }}
      SCREENSHOT_MODE: ${{ vars.SCREENSHOT_MODE || 'apps_script' }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        # Inputs travel as env, not pasted into the script. On a scheduled run the inputs context is
        # empty, so each one falls back to the same default the dispatch form shows.
        env:
          IN_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          IN_BRAND: ${{ inputs.brand || '' }}
          IN_PLATFORM: ${{ inputs.platform || '' }}
          IN_ONLY_TYPE: ${{ inputs.only_type || '' }}
          IN_OFFSET: ${{ inputs.offset || '0' }}
          IN_SKIP_UNJUDGED: ${{ inputs.skip_unjudged && 'true' || 'false' }}
          IN_COMPARE: ${{ inputs.compare && 'true' || 'false' }}
          IN_SELFTEST: ${{ inputs.selftest || '' }}
        run: |
          echo "trigger: ${{ github.event_name }}"
          ARGS=()
          if [ "$IN_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$IN_BRAND" ]; then ARGS+=(--brand "$IN_BRAND"); fi
          if [ -n "$IN_PLATFORM" ]; then read -ra P <<< "$IN_PLATFORM"; ARGS+=(--platform "${P[@]}"); fi
          if [ -n "$IN_ONLY_TYPE" ]; then ARGS+=(--only-type "$IN_ONLY_TYPE"); fi
          if [ -n "$IN_OFFSET" ] && [ "$IN_OFFSET" != "0" ]; then ARGS+=(--offset "$IN_OFFSET"); fi
          if [ "$IN_SKIP_UNJUDGED" = "true" ]; then ARGS+=(--skip-unjudged); fi
          if [ "$IN_COMPARE" = "true" ]; then ARGS+=(--compare); fi
          # A selftest replaces the run rather than adding to it: no browser, no scrape, no writes.
          if [ -n "$IN_SELFTEST" ]; then
            if [ "$IN_SELFTEST" = "1" ]; then ARGS=(--selftest)
            else ARGS=(--selftest "$IN_SELFTEST"); fi
          fi
          echo "python main.py ${ARGS[*]}"
          python main.py "${ARGS[@]}"

      - name: Upload run artefacts (report + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkm-run-${{ github.run_id }}
          path: scraper/out/
          retention-days: 30
          if-no-files-found: ignore
