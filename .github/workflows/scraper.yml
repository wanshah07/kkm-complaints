# KKM Cosmetic Complaint System — weekly scrape + NPRA review + push to Google Sheets.
#
# Schedule: every Friday 23:30 Malaysia Time (UTC+8) = 15:30 UTC Friday.
# GitHub cron runs in UTC only and can start up to ~15 min late under load; the
# concurrency block stops two runs overlapping if that ever happens.
#
# Required repository secrets
#   APPS_SCRIPT_WEBHOOK_URL   the Apps Script /exec URL
#   APPS_SCRIPT_API_TOKEN     API_TOKEN from the sheet's Script Properties
#   ANTHROPIC_API_KEY         (or OPENAI_API_KEY with LLM_PROVIDER=openai)
# Optional
#   PW_STORAGE_STATE_B64      base64 storage_state.json of a logged-in throwaway account
#   GDRIVE_SA_JSON            service-account JSON when SCREENSHOT_MODE=drive_api
#   GDRIVE_FOLDER_ID          Drive folder shared with that service account

name: KKM complaint scraper

on:
  schedule:
    - cron: '30 15 * * 5'          # Friday 23:30 MYT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scrape and review, but do not push to the sheet'
        type: boolean
        default: false
      brand:
        description: 'Only this brand (exact name from config.yaml)'
        type: string
        default: ''
      platform:
        description: 'Only this platform (Instagram | Facebook | Threads)'
        type: string
        default: ''

concurrency:
  group: kkm-complaint-scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      LLM_USE_SCREENSHOT: ${{ vars.LLM_USE_SCREENSHOT || '1' }}
      SCREENSHOT_MODE: ${{ vars.SCREENSHOT_MODE || 'apps_script' }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        working-directory: scraper
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ github.event.inputs.brand }}" ]; then ARGS="$ARGS --brand \"${{ github.event.inputs.brand }}\""; fi
          if [ -n "${{ github.event.inputs.platform }}" ]; then ARGS="$ARGS --platform ${{ github.event.inputs.platform }}"; fi
          eval python main.py $ARGS

      - name: Upload run artefacts (report + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkm-run-${{ github.run_id }}
          path: scraper/out/
          retention-days: 30
          if-no-files-found: ignore
