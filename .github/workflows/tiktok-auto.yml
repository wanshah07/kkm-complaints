# Find TikTok posts by account, without anybody pasting a link (Wan, 14 Nov 2026: "I want auto found tiktok post
# without manual, but I don't want kacau other live platform set").
#
# An account's post list is still not readable by a runner (see tiktok-links.yml). TikTok's public creator EMBED
# page is: it needs no login and names the account's pinned videos plus its ten newest. `discover` reads that page
# for every active Targets row with a handle in the TikTok column, drops what is already in the sheet or the
# reviewed ledger, and hands the new links to `review`, which is the same link reader the Links tab uses.
#
# Nothing here is shared with the Instagram / Facebook / Threads sweep: its own workflow, its own concurrency group,
# no PW_STORAGE_STATE_B64 (the sweep's login is never loaded), and scraper.yml is untouched. The Links tab is not
# written either, so a pasted link and a discovered one never wait on each other.
#
# A discovered post is FILED like a sweep post (status New, or the To check segment for a visual check), not held
# in the Links panel: that panel's hold exists for links a person pasted and is watching. Nothing is submitted to
# KKM by this or any other workflow.
#
# No artifacts are uploaded. Secrets used: APPS_SCRIPT_WEBHOOK_URL, APPS_SCRIPT_API_TOKEN, the reviewer keys, and
# PW_STORAGE_STATE_SHOP_B64 (the TikTok login, consumer cookies only; optional, a public video reads logged out).

name: TikTok auto discovery

on:
  # Every three hours. GitHub fires this repository's schedules late and not every time (the 15-minute link
  # review lands a few times a day), so the interval is short on purpose: ten posts an account stay visible, and
  # a run with nothing new is a ten-second job with no browser.
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
    inputs:
      handle:
        description: 'Optional: only this TikTok handle (must be an active Targets row). Empty = every row with a TikTok handle.'
        type: string
        required: false
        default: ''
      max:
        description: 'Most new videos to review in this run (the rest wait for the next run)'
        type: string
        required: false
        default: '20'
      dry_run:
        description: 'Read and review, but do not push to the sheet'
        type: boolean
        default: false
      reshoot_ids:
        description: 'Instead of a discovery run: take the screenshot of these TikTok complaint IDs again (comma separated)'
        type: string
        required: false
        default: ''

concurrency:
  group: kkm-tiktok-auto
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    if: ${{ !github.event.inputs.reshoot_ids }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.d.outputs.count }}
      links: ${{ steps.d.outputs.links }}
      meta: ${{ steps.d.outputs.meta }}
    env:
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      INPUT_HANDLE: ${{ github.event.inputs.handle }}
      TIKTOK_AUTO_MAX: ${{ github.event.inputs.max || '20' }}
    steps:
      - uses: actions/checkout@v5
      - id: d
        run: python3 tools/tiktok_discover.py

  review:
    needs: discover
    if: needs.discover.outputs.count != '' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
      ANTHROPIC_MODEL_FALLBACKS: ${{ vars.ANTHROPIC_MODEL_FALLBACKS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      OPENAI_MODEL_FALLBACKS: ${{ vars.OPENAI_MODEL_FALLBACKS }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      LLM_USE_SCREENSHOT: ${{ vars.LLM_USE_SCREENSHOT || '1' }}
      SCREENSHOT_MODE: ${{ vars.SCREENSHOT_MODE || 'apps_script' }}
      PW_STORAGE_STATE_SHOP_B64: ${{ secrets.PW_STORAGE_STATE_SHOP_B64 }}
      # Links and the Targets rows behind them travel as environment variables, never spliced into the shell line.
      # LINKS_REPORT is deliberately not set: these links did not come from the Links tab and nothing is written to it.
      TIKTOK_LINKS: ${{ needs.discover.outputs.links }}
      TIKTOK_LINK_META: ${{ needs.discover.outputs.meta }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium
      - name: Review the discovered videos
        working-directory: scraper
        run: |
          ARGS="--tiktok-links"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python main.py $ARGS

  # Not part of a discovery run: only when complaint IDs are named by hand. Writes one field, Screenshot Link, on
  # open TikTok rows (tools/tiktok_reshoot.py).
  reshoot:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reshoot_ids }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
      IDS: ${{ github.event.inputs.reshoot_ids }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies and Chromium
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Take the screenshots again
        run: |
          ARGS=(--ids "$IDS")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python tools/tiktok_reshoot.py "${ARGS[@]}"
