# Screenshots for the complaint rows that came from a shop or brand website and have none (Wan, 5 Nov 2026).
# Opens each row's Post URL in a real (headed) Chromium under Xvfb, checks it is the product page, uploads the
# picture through the Apps Script and writes the Drive link into Screenshot Link. Dispatch only: it has no
# schedule, so it can never be a second sweep competing with scraper.yml.
name: Retail screenshots

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many rows (0 = all that qualify). Rows that already have a NOT number go first.'
        type: string
        default: '60'
      ids:
        description: 'Only these complaint IDs (comma separated). Blank = every qualifying row.'
        type: string
        default: ''
      hosts:
        description: 'Only these hosts (comma separated, e.g. guardian.com.my). Blank = all.'
        type: string
        default: ''
      dry_run:
        description: 'Open and judge each page but upload nothing and write nothing'
        type: boolean
        default: false

concurrency:
  group: kkm-retail-shots
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright, Chromium and Xvfb
        run: |
          python -m pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Photograph the pages
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          IDS: ${{ github.event.inputs.ids }}
          HOSTS: ${{ github.event.inputs.hosts }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--limit "${LIMIT:-60}" --ids "$IDS" --hosts "$HOSTS" --max-minutes 150)
          if [ "$DRY" = "true" ]; then ARGS+=(--dry-run); fi
          xvfb-run -a python tools/retail_shots.py "${ARGS[@]}"
