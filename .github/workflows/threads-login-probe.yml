name: Threads login probe

# Does Threads accept the saved login from a runner? Presents only the Threads cookies (never Instagram's), so a sweep
# running at the same time is not disturbed. Counts and names only; no pictures. Run by hand.
on:
  workflow_dispatch:
    inputs:
      handle:
        description: A public Threads profile to read
        default: hygr.my

concurrency:
  group: kkm-threads-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}
      HANDLE: ${{ inputs.handle }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}
      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium
      - name: Probe
        run: python tools/threads_login_probe.py --handle "$HANDLE"
