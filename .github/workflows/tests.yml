# Unit tests (15 Nov 2026). Until now every test lived in a scratch folder and was lost with it; these run on every
# pull request and on main. No browser, no network, no secrets: the scraper's pure logic (ordering, status mapping,
# TikTok discovery parsing, link safety) and the Apps Script Targets backend against a fake spreadsheet in Node.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kkm-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        run: python -m pip install -q -r scraper/requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -t . -v
      - name: Apps Script tests (Node, fake spreadsheet)
        run: |
          for f in tests/gas/*.js; do [ -e "$f" ] || continue; echo "== $f"; node "$f"; done
