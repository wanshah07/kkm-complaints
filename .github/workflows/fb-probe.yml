name: Facebook login probe

# What Facebook does with the saved login when a runner presents it (tools/fb_probe.py). Run by hand only.
# It loads Facebook's cookies alone, so it does not disturb a sweep that is using the Instagram and Threads logins.
on:
  workflow_dispatch:
    inputs:
      handle:
        description: A Facebook page to read as a test
        default: cetaphilmalaysia

concurrency:
  group: kkm-fb-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}
      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium
      - name: Probe
        env:
          HANDLE: ${{ inputs.handle }}
        run: python tools/fb_probe.py --handle "$HANDLE" --out fb_probe_out
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-probe-${{ github.run_id }}
          path: fb_probe_out/
          retention-days: 7
          if-no-files-found: ignore
