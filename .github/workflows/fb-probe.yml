name: Facebook login probe

# What Facebook does with the saved login when a runner presents it (tools/fb_probe.py). Run by hand only.
# It loads Facebook's cookies alone, so it does not disturb a sweep that is using the Instagram and Threads logins.
on:
  workflow_dispatch:
    inputs:
      handle:
        description: A Facebook page to read as a test
        default: cetaphilmalaysia
      public:
        description: Pages to read with no login at all, comma separated
        default: cetaphilmalaysia,larocheposaymalaysia
      adq:
        description: A word to look up in Meta's Ad Library (Malaysia)
        default: cetaphil
      ads_page:
        description: A Facebook page handle whose own ads are listed in the Ad Library
        default: cetaphilmalaysia
      sweep_test:
        description: "Brand=handle pairs, comma separated: run the sweep's own Facebook code on them (nothing is filed)"
        default: ''
      resolve:
        description: "Handles, comma separated: which public route gives each page's numeric id"
        default: ''
      search:
        description: "Words, comma separated: Ad Library keyword search, printing each advertiser"
        default: ''
      no_public_page:
        description: "Sweep test: skip the page's public address, so the lookup by name is tested"
        type: boolean
        default: false
      only_sweep_test:
        description: Skip the login and public-page probes
        type: boolean
        default: false

concurrency:
  group: kkm-fb-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Kuala_Lumpur
      PYTHONUNBUFFERED: '1'
      PW_STORAGE_STATE_B64: ${{ secrets.PW_STORAGE_STATE_B64 }}
      PW_STORAGE_STATE_IG_B64: ${{ secrets.PW_STORAGE_STATE_IG_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install dependencies
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}
      - name: Install Chromium
        working-directory: scraper
        run: python -m playwright install --with-deps chromium
      - name: Probe
        env:
          HANDLE: ${{ inputs.handle }}
          PUBLIC: ${{ inputs.public }}
          ADQ: ${{ inputs.adq }}
          ADS_PAGE: ${{ inputs.ads_page }}
          SWEEP_TEST: ${{ inputs.sweep_test }}
          RESOLVE: ${{ inputs.resolve }}
          SEARCH: ${{ inputs.search }}
          ONLY: ${{ inputs.only_sweep_test && '--only-sweep-test' || '' }}
          NOPUB: ${{ inputs.no_public_page && '--no-public-page' || '' }}
        run: python tools/fb_probe.py --handle "$HANDLE" --public "$PUBLIC" --adq "$ADQ" --ads-page "$ADS_PAGE" --sweep-test "$SWEEP_TEST" --resolve "$RESOLVE" --search "$SEARCH" $ONLY $NOPUB --out fb_probe_out
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-probe-${{ github.run_id }}
          path: fb_probe_out/
          retention-days: 7
          if-no-files-found: ignore
