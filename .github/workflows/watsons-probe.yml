# Can a real browser on a GitHub runner read watsons.com.my (plain HTTP gets an Akamai 403)?
# Read-only: loads a few public pages with stock Playwright Chromium, headless then headed under
# Xvfb, and says what came back. Writes nothing to the sheet. Dispatch only.
name: Watsons probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to load, one per line (blank = home, a brand page, a product page).'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Probe (headless)
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mapfile -t ARR < <(printf '%s\n' "$URLS" | sed '/^\s*$/d')
          python tools/watsons_probe.py "${ARR[@]}"
      - name: Probe (headed, Xvfb)
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          mapfile -t ARR < <(printf '%s\n' "$URLS" | sed '/^\s*$/d')
          xvfb-run -a python tools/watsons_probe.py --headed "${ARR[@]}"
