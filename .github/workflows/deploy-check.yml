# Read-only check of the live Apps Script deployment. Dispatch only, no schedule, writes nothing.
name: Deploy check
on:
  workflow_dispatch:
concurrency:
  group: kkm-deploy-check
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
      APPS_SCRIPT_API_TOKEN: ${{ secrets.APPS_SCRIPT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scraper/requirements.txt
      - run: python tools/deploy_check.py
